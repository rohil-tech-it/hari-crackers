        .log-container p.success { color: #2ecc71; }
        .log-container p.error { color: #e74c3c; }
        .log-container p.warning { color: #f1c40f; }
        .log-container p.info { color: #a855f7; }
        .stats { display: flex; gap: 24px; flex-wrap: wrap; padding: 12px 0; border-top: 1px solid rgba(255, 201, 60, 0.08); margin-top: 16px; }
        .stats span { color: #d6c9ec; font-size: 0.9rem; }
        .stats strong { color: #ffc93c; }
        .progress-bar { width: 100%; height: 6px; background: #1B0A2E; border-radius: 999px; margin-top: 12px; overflow: hidden; }

        // ============================================================
        // UI HELPERS
        // ============================================================
        const logEl = document.getElementById('log');

        function log(message, type = 'info') {
            const p = document.createElement('p');
            p.className = type;
            p.textContent = `[${new Date().toLocaleTimeString()}] ${message}`;
            logEl.appendChild(p);
            logEl.scrollTop = logEl.scrollHeight;
        }

        function setStatus(status, label) {
            const badge = document.getElementById('statusBadge');
            badge.className = 'status-badge ' + status;
            badge.textContent = label;
        }

        function setProgress(percent, state = '') {
            const fill = document.getElementById('progressFill');
            fill.style.width = percent + '%';
            fill.className = 'fill ' + state;
        }

        // ============================================================
        // FIRESTORE + STORAGE HELPERS
        // ============================================================
        const productsCol = collection(db, 'products');

        async function refreshCount() {
            try {
                const snap = await getDocs(productsCol);
                const count = snap.size;
                document.getElementById('totalCount').textContent = count;
                document.getElementById('seededCount').textContent = count;
                log(`📦 Products currently in Firestore: ${count}`, 'info');
                return count;
            } catch (err) {
                log('Failed to refresh count: ' + err.message, 'error');
                return 0;
            }
        }

        async function resolveImageUrl(filename) {
            if (!filename) return '';
            try {
                const imageRef = ref(storage, `products/${filename}`);
                return await getDownloadURL(imageRef);
            } catch (err) {
                try {
                    const imageRef = ref(storage, filename);
                    return await getDownloadURL(imageRef);
                } catch (err2) {
                    log(`⚠️ Image not found in Storage: ${filename}`, 'warning');
                    return '';
                }
            }
        }

        async function seedAllProducts() {
            const seedBtn = document.getElementById('seedBtn');
            const clearBtn = document.getElementById('clearBtn');
            seedBtn.disabled = true;
            clearBtn.disabled = true;
            setStatus('running', 'Running');
            setProgress(0);

            const total = allProducts.length;
            document.getElementById('totalProducts').textContent = total;

            log(`🌱 Starting seed of ${total} products...`, 'info');

            let success = 0;
            let failed = 0;

            for (let i = 0; i < total; i++) {
                const p = allProducts[i];
                try {
                    const imageUrl = await resolveImageUrl(productImageMap[p.name]);

                    const docData = {
                        name: p.name,
                        category: p.category,
                        sub: p.sub,
                        price: p.price,
                        oldPrice: p.oldPrice,
                        stockQty: p.stockQty,
                        imageUrl: imageUrl,
                        createdAt: new Date().toISOString(),
                        updatedAt: new Date().toISOString(),
                        // ⭐ Admin Panel-ku idhu RENDU MUKKIYAM:
                        orderIndex: i + 1,        // 1-based order (Admin Panel orderBy pannuthu)
                        inStock: true,             // default in-stock
                        lowStockThreshold: 5       // default low-stock alert
                    };

                    await addDoc(productsCol, docData);
                    success++;
                    log(`✅ [${i + 1}/${total}] Added: ${p.name}`, 'success');
                } catch (err) {
                    failed++;
                    log(`❌ [${i + 1}/${total}] Failed: ${p.name} — ${err.message}`, 'error');
                }

                document.getElementById('seededCount').textContent = success;
                setProgress(Math.round(((i + 1) / total) * 100));
            }

            setProgress(100, failed === 0 ? 'success' : 'error');
            setStatus(failed === 0 ? 'done' : 'error', failed === 0 ? 'Done' : 'Finished with errors');
            log(`🎉 Seeding complete! ${success} succeeded, ${failed} failed.`, failed === 0 ? 'success' : 'warning');

            await refreshCount();

            seedBtn.disabled = false;
            clearBtn.disabled = false;
        }

        async function clearAllProducts() {
            const seedBtn = document.getElementById('seedBtn');
            const clearBtn = document.getElementById('clearBtn');
            seedBtn.disabled = true;
            clearBtn.disabled = true;
            setStatus('running', 'Deleting');
            setProgress(0);

            log('🗑️ Clearing all products from Firestore...', 'warning');

            try {
                const snap = await getDocs(productsCol);
                const total = snap.size;
                let deleted = 0;

                for (const document of snap.docs) {
                    await deleteDoc(doc(db, 'products', document.id));
                    deleted++;
                    setProgress(Math.round((deleted / total) * 100));
                    if (deleted % 10 === 0 || deleted === total) {
                        log(`🗑️ Deleted ${deleted}/${total}...`, 'info');
                    }
                }

                setProgress(100, 'success');
                setStatus('done', 'Cleared');
                log(`✅ Cleared ${deleted} products.`, 'success');
                await refreshCount();
            } catch (err) {
                setStatus('error', 'Error');
                log('❌ Clear failed: ' + err.message, 'error');
            } finally {
                seedBtn.disabled = false;
                clearBtn.disabled = false;
            }
        }

        // Expose to global so inline onclick handlers work
        window.seedAllProducts = seedAllProducts;
        window.clearAllProducts = clearAllProducts;
        window.refreshCount = refreshCount;

        // Set total on load
        document.getElementById('totalProducts').textContent = allProducts.length;
